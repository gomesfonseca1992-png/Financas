<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Finanças Fábio & Erika</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d1a;--bg2:#13132a;--bg3:#1a1a35;--bd:#222248;--bd2:#2a2a50;--tx:#e8e8f0;--tx2:#9090c0;--tx3:#5555a0;--green:#6BCB77;--red:#FF6B6B;--yellow:#FFD93D;--purple:#7B61FF;--pink:#FF6B9D;--r:14px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:80px;font-size:14px}
button,input,select{font-family:inherit;cursor:pointer}
/* Header */
.hdr{background:linear-gradient(135deg,#1a1a3e,var(--bg));padding:22px 16px 14px;border-bottom:1px solid var(--bd)}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.logo{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.bal-lbl{font-size:11px;color:var(--tx3);text-align:right}
.bal-val{font-size:22px;font-weight:800;text-align:right}
.urgent{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:10px;padding:8px 12px;font-size:12px;color:#FF8080;display:flex;align-items:center;gap:6px;margin-top:6px}
/* Action bar */
.abar{display:flex;gap:8px;padding:12px 16px 0}
.abar-btn{flex:1;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:9px 6px;color:var(--tx2);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .15s}
.abar-btn:active{opacity:.65}
/* Stats */
.stats{display:flex;gap:8px;padding:14px 16px 0}
.scard{flex:1;border-radius:var(--r);padding:11px 12px}
.slbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px}
.sval{font-size:15px;font-weight:800;margin-top:3px}
/* Content */
.content{padding:20px 16px 0}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-ttl{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:1.5px}
.btn-add{background:linear-gradient(135deg,var(--purple),var(--pink));border:none;border-radius:20px;padding:6px 14px;color:#fff;font-size:12px;font-weight:700}
.btn-add:active{opacity:.8}
/* Bill card */
.bcard{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:9px;transition:opacity .2s}
.bcard.done{opacity:.42}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta{font-size:11px;color:var(--tx3);margin-top:2px}
.bamt{font-size:15px;font-weight:800;white-space:nowrap}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .2s;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.del{background:none;border:none;color:var(--bd2);font-size:18px;padding:0 2px;line-height:1;flex-shrink:0}
.del:hover{color:var(--red)}
/* Badges */
.badge{border-radius:99px;padding:2px 9px;font-size:10px;font-weight:700;white-space:nowrap}
.b-today{background:#FF3B3B;color:#fff}
.b-urg{background:var(--red);color:#fff}
.b-soon{background:var(--yellow);color:#1a1a2e}
.b-ok{background:var(--bg3);color:var(--tx2)}
/* Transaction card */
.tcard{background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.ticon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tmeta{font-size:11px;color:var(--tx3);margin-top:1px}
.tamt{font-size:14px;font-weight:800;white-space:nowrap;margin-left:auto}
.thumb{width:32px;height:32px;border-radius:7px;object-fit:cover;cursor:pointer;border:1px solid var(--bd);flex-shrink:0}
.photo-btn{width:32px;height:32px;border-radius:7px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx3);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.photo-btn:active{opacity:.7}
/* Bars */
.bar-row{margin-bottom:8px}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar-track{height:7px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;z-index:50}
.nbtn{flex:1;padding:12px 0 8px;background:none;border:none;color:var(--bd2);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;position:relative}
.nbtn.act{color:var(--purple);font-weight:700}
.nbadge{position:absolute;top:8px;right:calc(50% - 18px);background:var(--red);border-radius:99px;font-size:9px;padding:1px 5px;color:#fff}
/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.mbox{background:#141428;border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:24px 18px 36px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.mttl{font-size:17px;font-weight:800;margin-bottom:16px}
.field{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;color:var(--tx);font-size:14px;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--purple)}
.row2{display:flex;gap:8px}.row2 .field{flex:1;margin-bottom:0}
.row2-wrap{display:flex;gap:8px;margin-bottom:10px}
.tgl{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--bd);margin-bottom:10px}
.tbtn{flex:1;padding:10px;background:transparent;border:none;color:var(--tx2);font-size:13px;transition:all .2s}
.tbtn.act{background:var(--purple);color:#fff;font-weight:700}
.bsub{width:100%;background:linear-gradient(135deg,var(--purple),var(--pink));border:none;border-radius:12px;padding:13px;color:#fff;font-size:15px;font-weight:700;margin-top:4px}
.bsub:active{opacity:.85}
.bcan{width:100%;background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:11px;color:var(--tx2);font-size:14px;margin-top:8px}
.bcan:active{opacity:.75}
.chk-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--tx2)}
.chk-row input{width:16px;height:16px;accent-color:var(--purple);cursor:pointer}
/* Photo area */
.photo-area{border:2px dashed var(--bd2);border-radius:12px;padding:14px;text-align:center;color:var(--tx3);font-size:13px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,color .2s}
.photo-area:hover{border-color:var(--purple);color:var(--purple)}
.photo-prev{width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:none}
/* Notification */
.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);border-radius:12px;padding:10px 18px;font-size:13px;color:var(--tx);z-index:400;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;pointer-events:none;animation:sldn .3s ease}
@keyframes sldn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
.lb img{max-width:100%;max-height:68vh;border-radius:12px;object-fit:contain}
.lb-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lb-btn{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:9px 18px;color:var(--tx);font-size:13px}
.lb-btn.danger{color:var(--red);border-color:rgba(255,107,107,.3)}
.empty{text-align:center;padding:28px;color:var(--tx3);font-size:13px}
select option{background:#141428}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5)}
</style>
</head>
<body>
<div id="root"></div>
<div class="notif" id="notif"></div>
<!-- Hidden file inputs -->
<input type="file" id="xl-file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
<input type="file" id="photo-file" accept="image/*" style="display:none" onchange="handlePhotoFile(this)">

<script>
const CATS=["Moradia","Alimentação","Transporte","Saúde","Lazer","Educação","Outros"];
const CLR={Moradia:"#FF6B6B",Alimentação:"#FFD93D",Transporte:"#6BCB77",Saúde:"#4D96FF",Lazer:"#C77DFF",Educação:"#FF9F1C",Outros:"#A8DADC"};

let tab="dashboard", txType="expense", pendingPhoto=null, photoTarget=null, notifTO;
let db={bills:[],transactions:[]};

function initData(){
  return{
    bills:[
      {id:"1",name:"Aluguel",amount:1500,dueDay:5,category:"Moradia",paid:false,recurring:true},
      {id:"2",name:"Internet",amount:120,dueDay:10,category:"Moradia",paid:false,recurring:true},
      {id:"3",name:"Academia",amount:80,dueDay:15,category:"Saúde",paid:true,recurring:true},
      {id:"4",name:"Netflix",amount:55,dueDay:20,category:"Lazer",paid:false,recurring:true},
    ],
    transactions:[
      {id:"t1",desc:"Salário",amount:5000,type:"income",date:"2026-05-01",category:"Outros",photo:null},
      {id:"t2",desc:"Supermercado",amount:-350,type:"expense",date:"2026-05-03",category:"Alimentação",photo:null},
      {id:"t3",desc:"Uber",amount:-45,type:"expense",date:"2026-05-05",category:"Transporte",photo:null},
      {id:"t4",desc:"Freelance",amount:800,type:"income",date:"2026-05-10",category:"Outros",photo:null},
      {id:"t5",desc:"Farmácia",amount:-90,type:"expense",date:"2026-05-12",category:"Saúde",photo:null},
    ]
  };
}

function loadDB(){
  try{ const s=localStorage.getItem("fpro_v3"); db=s?JSON.parse(s):initData(); db.transactions.forEach(t=>{if(!("photo" in t))t.photo=null;}); }
  catch(e){ db=initData(); }
}
function saveDB(){ try{localStorage.setItem("fpro_v3",JSON.stringify(db));}catch(e){} }

function days(dueDay){
  const t=new Date(),d=t.getDate();
  if(dueDay>=d) return dueDay-d;
  return new Date(t.getFullYear(),t.getMonth()+1,0).getDate()-d+dueDay;
}
function fR(v){ return "R$ "+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2}); }
function fD(d){ return new Date(d+"T12:00:00").toLocaleDateString("pt-BR"); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

function notify(msg,type="ok"){
  const c={ok:"#1a3a2a",info:"#1a1a3e",warn:"#3a2a0a"};
  const b={ok:"#2a6a3a",info:"#3a3a7a",warn:"#7a5a0a"};
  const el=document.getElementById("notif");
  el.textContent=msg; el.style.background=c[type]||c.ok; el.style.border=`1px solid ${b[type]||b.ok}`; el.style.display="block";
  clearTimeout(notifTO); notifTO=setTimeout(()=>{el.style.display="none";},3200);
}

/* ---- RENDER ---- */
function render(){
  document.getElementById("root").innerHTML=buildPage();
}

function buildPage(){
  const unpaid=db.bills.filter(b=>!b.paid);
  const urg=unpaid.filter(b=>days(b.dueDay)<=3);
  const inc=db.transactions.filter(t=>t.type==="income").reduce((s,t)=>s+Math.abs(t.amount),0);
  const exp=db.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Math.abs(t.amount),0);
  const bal=inc-exp;
  const billsTot=unpaid.reduce((s,b)=>s+b.amount,0);

  return `
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="logo">💑 Fábio & Erika</div>
        <div class="logo-sub">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
      </div>
      <div>
        <div class="bal-lbl">Saldo Atual</div>
        <div class="bal-val" style="color:${bal>=0?"var(--green)":"var(--red)"}">${bal>=0?"+":""}${fR(bal)}</div>
      </div>
    </div>
    ${urg.length?`<div class="urgent">🔔 <strong>${urg.length} conta${urg.length>1?"s":""} vencendo:</strong> ${urg.map(b=>b.name).join(", ")}</div>`:""}
  </div>

  <div class="abar">
    <button class="abar-btn" onclick="exportExcel()">📥 Backup Excel</button>
    <button class="abar-btn" onclick="document.getElementById('xl-file').click()">📤 Importar Excel</button>
  </div>

  <div class="stats">
    <div class="scard" style="background:rgba(107,203,119,.08);border:1px solid rgba(107,203,119,.22)">
      <div class="slbl">Receitas</div><div class="sval" style="color:var(--green)">${fR(inc)}</div>
    </div>
    <div class="scard" style="background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.22)">
      <div class="slbl">Despesas</div><div class="sval" style="color:var(--red)">${fR(exp)}</div>
    </div>
    <div class="scard" style="background:rgba(255,217,61,.08);border:1px solid rgba(255,217,61,.22)">
      <div class="slbl">A Pagar</div><div class="sval" style="color:var(--yellow)">${fR(billsTot)}</div>
    </div>
  </div>

  <div class="content">
    ${tab==="dashboard"?buildDash(unpaid):""}
    ${tab==="bills"?buildBillsTab():""}
    ${tab==="transactions"?buildTxTab():""}
  </div>

  <nav>
    <button class="nbtn ${tab==="dashboard"?"act":""}" onclick="setTab('dashboard')">
      <span style="font-size:20px">📊</span>Resumo
    </button>
    <button class="nbtn ${tab==="bills"?"act":""}" onclick="setTab('bills')">
      <span style="font-size:20px">🔔</span>Contas
      ${unpaid.length?`<span class="nbadge">${unpaid.length}</span>`:""}
    </button>
    <button class="nbtn ${tab==="transactions"?"act":""}" onclick="setTab('transactions')">
      <span style="font-size:20px">💸</span>Lançamentos
    </button>
  </nav>`;
}

function badgeHTML(dueDay,paid){
  if(paid) return "";
  const d=days(dueDay);
  if(d===0) return `<span class="badge b-today">HOJE</span>`;
  if(d<=3) return `<span class="badge b-urg">⚡ ${d}d</span>`;
  if(d<=7) return `<span class="badge b-soon">⏰ ${d}d</span>`;
  return `<span class="badge b-ok">${d}d</span>`;
}

function billCard(b,showDel){
  return `<div class="bcard ${b.paid?"done":""}">
    <button class="chk ${b.paid?"on":""}" onclick="togglePaid('${b.id}')">${b.paid?"✓":""}</button>
    <span class="cdot" style="background:${CLR[b.category]||"#888"}"></span>
    <div style="flex:1;min-width:0">
      <div class="bname" style="${b.paid?"text-decoration:line-through":""}">${b.name}</div>
      <div class="bmeta">Dia ${b.dueDay} · ${b.category}${b.recurring?" · recorrente":""}</div>
    </div>
    ${badgeHTML(b.dueDay,b.paid)}
    <div class="bamt">${fR(b.amount)}</div>
    ${showDel?`<button class="del" onclick="delBill('${b.id}')">×</button>`:""}
  </div>`;
}

function txCard(t,showAct){
  const inc=t.type==="income";
  const photoEl=t.photo
    ?`<img class="thumb" src="${t.photo}" onclick="viewPhoto('${t.id}')" title="Ver comprovante">`
    :(showAct?`<button class="photo-btn" onclick="openPhotoUpload('${t.id}')" title="Adicionar comprovante">📎</button>`:"");
  return `<div class="tcard" style="border:1px solid ${inc?"rgba(107,203,119,.2)":"rgba(255,107,107,.1)"}">
    <div class="ticon" style="background:${inc?"rgba(107,203,119,.12)":"rgba(255,107,107,.12)"}">${inc?"💰":"💸"}</div>
    <div style="flex:1;min-width:0">
      <div class="tname">${t.desc}</div>
      <div class="tmeta">${fD(t.date)} · ${t.category}</div>
    </div>
    ${photoEl}
    <div class="tamt" style="color:${inc?"var(--green)":"var(--red)"}">${inc?"+":"-"}${fR(t.amount)}</div>
    ${showAct?`<button class="del" onclick="delTx('${t.id}')">×</button>`:""}
  </div>`;
}

function buildDash(unpaid){
  const sorted=[...unpaid].sort((a,b)=>days(a.dueDay)-days(b.dueDay)).slice(0,4);
  const catExp=CATS.map(c=>({c,v:db.transactions.filter(t=>t.type==="expense"&&t.category===c).reduce((s,t)=>s+Math.abs(t.amount),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const mx=Math.max(...catExp.map(x=>x.v),1);
  return `
    <div class="sec-hdr"><span class="sec-ttl">📌 Próximos Vencimentos</span></div>
    ${sorted.length?sorted.map(b=>billCard(b,false)).join(""):`<div class="empty">🎉 Nenhuma conta pendente!</div>`}
    <div class="sec-hdr" style="margin-top:22px"><span class="sec-ttl">📈 Gastos por Categoria</span></div>
    ${catExp.length?catExp.map(({c,v})=>`
      <div class="bar-row">
        <div class="bar-lbl">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${CLR[c]||"#888"};display:inline-block"></span>${c}</span>
          <span style="font-weight:700">${fR(v)}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v/mx)*100}%;background:${CLR[c]||"var(--purple)"}"></div></div>
      </div>`).join(""):`<div class="empty">Nenhuma despesa registrada</div>`}
    <div class="sec-hdr" style="margin-top:22px"><span class="sec-ttl">🕐 Últimos Lançamentos</span></div>
    ${db.transactions.slice(0,5).map(t=>txCard(t,false)).join("")}
  `;
}

function buildBillsTab(){
  const s=[...db.bills].sort((a,b)=>days(a.dueDay)-days(b.dueDay));
  return `
    <div class="sec-hdr">
      <span class="sec-ttl">🔔 Contas (${db.bills.length})</span>
      <button class="btn-add" onclick="showModal('m-bill')">+ Nova Conta</button>
    </div>
    ${s.length?s.map(b=>billCard(b,true)).join(""):`<div class="empty">Nenhuma conta cadastrada</div>`}
    <!-- Add Bill Modal -->
    <div class="overlay" id="m-bill" onclick="overlayClick(event,'m-bill')">
      <div class="mbox">
        <div class="mttl">📌 Nova Conta</div>
        <input class="field" id="b-name" placeholder="Nome (ex: Conta de Luz)">
        <div class="row2-wrap">
          <input class="field" id="b-amt" type="number" placeholder="Valor (R$)" min="0" style="flex:1">
          <input class="field" id="b-day" type="number" placeholder="Dia venc." min="1" max="31" style="flex:1">
        </div>
        <select class="field" id="b-cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
        <div class="chk-row">
          <input type="checkbox" id="b-rec" checked>
          <label for="b-rec">Recorrente (mensal)</label>
        </div>
        <button class="bsub" onclick="addBill()">Adicionar Conta</button>
        <button class="bcan" onclick="hideModal('m-bill')">Cancelar</button>
      </div>
    </div>`;
}

function buildTxTab(){
  const today=new Date().toISOString().split("T")[0];
  return `
    <div class="sec-hdr">
      <span class="sec-ttl">💸 Lançamentos (${db.transactions.length})</span>
      <button class="btn-add" onclick="showModal('m-tx')">+ Novo</button>
    </div>
    ${db.transactions.length?db.transactions.map(t=>txCard(t,true)).join(""):`<div class="empty">Nenhum lançamento registrado</div>`}
    <!-- Add TX Modal -->
    <div class="overlay" id="m-tx" onclick="overlayClick(event,'m-tx')">
      <div class="mbox">
        <div class="mttl">💸 Novo Lançamento</div>
        <div class="tgl">
          <button class="tbtn act" id="tt-exp" onclick="setTxType('expense')">💸 Despesa</button>
          <button class="tbtn" id="tt-inc" onclick="setTxType('income')">💰 Receita</button>
        </div>
        <input class="field" id="tx-desc" placeholder="Descrição (ex: Supermercado)">
        <div class="row2-wrap">
          <input class="field" id="tx-amt" type="number" placeholder="Valor (R$)" min="0" style="flex:1">
          <input class="field" id="tx-date" type="date" value="${today}" style="flex:1">
        </div>
        <select class="field" id="tx-cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
        <div class="photo-area" onclick="document.getElementById('photo-new').click()">
          <span id="photo-lbl">📎 Adicionar comprovante (opcional)</span>
        </div>
        <input type="file" id="photo-new" accept="image/*" style="display:none" onchange="newPhotoSelected(this)">
        <img id="photo-prev" class="photo-prev">
        <button class="bsub" onclick="addTx()">Registrar Lançamento</button>
        <button class="bcan" onclick="cancelTx()">Cancelar</button>
      </div>
    </div>`;
}

/* ---- ACTIONS ---- */
function setTab(t){ tab=t; render(); }

function showModal(id){ const el=document.getElementById(id); if(el){ el.style.display="flex"; el.classList.add("show"); }}
function hideModal(id){ const el=document.getElementById(id); if(el){ el.style.display="none"; el.classList.remove("show"); }}
function overlayClick(e,id){ if(e.target.id===id) hideModal(id); }

function togglePaid(id){
  const b=db.bills.find(x=>String(x.id)===String(id)); if(!b) return;
  b.paid=!b.paid; saveDB();
  notify(b.paid?`✅ "${b.name}" pago!`:`↩️ "${b.name}" desmarcado`,b.paid?"ok":"info");
  render();
}
function delBill(id){
  const b=db.bills.find(x=>String(x.id)===String(id));
  db.bills=db.bills.filter(x=>String(x.id)!==String(id)); saveDB();
  notify(`🗑️ "${b?.name}" removido`,"info"); render();
}
function delTx(id){
  db.transactions=db.transactions.filter(x=>String(x.id)!==String(id)); saveDB();
  notify("🗑️ Lançamento removido","info"); render();
}

function addBill(){
  const name=document.getElementById("b-name")?.value?.trim();
  const amt=parseFloat(document.getElementById("b-amt")?.value);
  const day=parseInt(document.getElementById("b-day")?.value);
  const cat=document.getElementById("b-cat")?.value;
  const rec=document.getElementById("b-rec")?.checked;
  if(!name||!amt||!day||day<1||day>31){ alert("Preencha todos os campos!"); return; }
  db.bills.push({id:uid(),name,amount:amt,dueDay:day,category:cat,recurring:rec,paid:false});
  saveDB(); hideModal("m-bill"); notify(`📌 "${name}" adicionado!`); render();
}

function setTxType(t){
  txType=t;
  const e=document.getElementById("tt-exp"),i=document.getElementById("tt-inc");
  if(e) e.className="tbtn"+(t==="expense"?" act":"");
  if(i) i.className="tbtn"+(t==="income"?" act":"");
}

function newPhotoSelected(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    pendingPhoto=e.target.result;
    const p=document.getElementById("photo-prev"),l=document.getElementById("photo-lbl");
    if(p){p.src=pendingPhoto;p.style.display="block";}
    if(l) l.textContent="✅ Comprovante selecionado";
  };
  r.readAsDataURL(f);
}

function addTx(){
  const desc=document.getElementById("tx-desc")?.value?.trim();
  const amt=parseFloat(document.getElementById("tx-amt")?.value);
  const date=document.getElementById("tx-date")?.value;
  const cat=document.getElementById("tx-cat")?.value;
  if(!desc||!amt||!date){ alert("Preencha todos os campos!"); return; }
  const type=txType;
  db.transactions.unshift({id:uid(),desc,amount:(type==="expense"?-1:1)*amt,type,date,category:cat,photo:pendingPhoto||null});
  pendingPhoto=null; txType="expense"; saveDB(); hideModal("m-tx");
  notify(type==="income"?"💰 Receita registrada!":"💸 Despesa registrada!"); render();
}

function cancelTx(){ pendingPhoto=null; txType="expense"; hideModal("m-tx"); }

/* ---- PHOTO ---- */
function openPhotoUpload(id){ photoTarget=id; document.getElementById("photo-file").click(); }

function handlePhotoFile(input){
  if(!photoTarget) return;
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    const tx=db.transactions.find(x=>String(x.id)===String(photoTarget));
    if(tx){ tx.photo=e.target.result; saveDB(); notify("📎 Comprovante salvo!"); render(); }
    photoTarget=null; input.value="";
  };
  r.readAsDataURL(f);
}

function viewPhoto(id){
  const tx=db.transactions.find(x=>String(x.id)===String(id));
  if(!tx?.photo) return;
  const lb=document.createElement("div");
  lb.className="lb";
  lb.innerHTML=`
    <div style="font-size:13px;color:var(--tx2)">${tx.desc} — ${fD(tx.date)}</div>
    <img src="${tx.photo}" alt="Comprovante">
    <div class="lb-btns">
      <button class="lb-btn" onclick="this.closest('.lb').remove()">✕ Fechar</button>
      <button class="lb-btn" onclick="dlPhoto('${id}')">⬇️ Baixar</button>
      <button class="lb-btn danger" onclick="rmPhoto('${id}')">🗑️ Remover</button>
    </div>`;
  document.body.appendChild(lb);
}

function dlPhoto(id){
  const tx=db.transactions.find(x=>String(x.id)===String(id));
  if(!tx?.photo) return;
  const a=document.createElement("a"); a.href=tx.photo;
  a.download=`comprovante_${tx.desc.replace(/\s+/g,"_")}_${tx.date}.jpg`; a.click();
}

function rmPhoto(id){
  const tx=db.transactions.find(x=>String(x.id)===String(id));
  if(tx) tx.photo=null;
  document.querySelector(".lb")?.remove(); saveDB();
  notify("🗑️ Comprovante removido","info"); render();
}

/* ---- EXCEL EXPORT ---- */
function exportExcel(){
  if(typeof XLSX==="undefined"){ alert("Biblioteca XLSX não carregada."); return; }
  const wb=XLSX.utils.book_new();

  // Lançamentos
  const txRows=db.transactions.map(t=>({
    "ID":String(t.id),"Descrição":t.desc,
    "Valor (R$)":Math.abs(t.amount).toFixed(2),
    "Tipo":t.type==="income"?"Receita":"Despesa",
    "Data":fD(t.date),"Data ISO":t.date,
    "Categoria":t.category,"Comprovante":t.photo?"Sim":"Não"
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(txRows),"Lançamentos");

  // Contas
  const bRows=db.bills.map(b=>({
    "ID":String(b.id),"Nome":b.name,
    "Valor (R$)":b.amount.toFixed(2),"Dia Vencimento":b.dueDay,
    "Categoria":b.category,"Pago":b.paid?"Sim":"Não","Recorrente":b.recurring?"Sim":"Não"
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bRows),"Contas");

  // Resumo
  const inc=db.transactions.filter(t=>t.type==="income").reduce((s,t)=>s+Math.abs(t.amount),0);
  const exp=db.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Math.abs(t.amount),0);
  const sumRows=[
    {"Item":"Total Receitas","Valor (R$)":inc.toFixed(2)},
    {"Item":"Total Despesas","Valor (R$)":exp.toFixed(2)},
    {"Item":"Saldo","Valor (R$)":(inc-exp).toFixed(2)},
    {"Item":"Contas a Pagar (pendentes)","Valor (R$)":db.bills.filter(b=>!b.paid).reduce((s,b)=>s+b.amount,0).toFixed(2)},
    {"Item":"Data do Relatório","Valor (R$)":new Date().toLocaleDateString("pt-BR")},
  ];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sumRows),"Resumo");

  XLSX.writeFile(wb,`financaspro_${new Date().toISOString().split("T")[0]}.xlsx`);
  notify("📥 Excel exportado com sucesso!");
}

/* ---- EXCEL IMPORT ---- */
function importExcel(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      let added={tx:0,bills:0};

      if(wb.SheetNames.includes("Lançamentos")){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets["Lançamentos"]);
        const ids=new Set(db.transactions.map(t=>String(t.id)));
        const news=rows.filter(r=>!ids.has(String(r["ID"]))).map(r=>({
          id:String(r["ID"]||uid()),desc:r["Descrição"]||r["Descricao"]||"Importado",
          amount:(r["Tipo"]==="Receita"?1:-1)*Math.abs(parseFloat(r["Valor (R$)"]||0)),
          type:r["Tipo"]==="Receita"?"income":"expense",
          date:r["Data ISO"]||new Date().toISOString().split("T")[0],
          category:r["Categoria"]||"Outros",photo:null
        }));
        db.transactions=[...news,...db.transactions]; added.tx=news.length;
      }

      if(wb.SheetNames.includes("Contas")){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets["Contas"]);
        const ids=new Set(db.bills.map(b=>String(b.id)));
        const news=rows.filter(r=>!ids.has(String(r["ID"]))).map(r=>({
          id:String(r["ID"]||uid()),name:r["Nome"]||"Importado",
          amount:Math.abs(parseFloat(r["Valor (R$)"]||0)),
          dueDay:parseInt(r["Dia Vencimento"]||1),
          category:r["Categoria"]||"Outros",
          paid:r["Pago"]==="Sim",recurring:r["Recorrente"]!=="Não"
        }));
        db.bills=[...db.bills,...news]; added.bills=news.length;
      }

      saveDB();
      notify(`📤 Importado: ${added.tx} lançamentos, ${added.bills} contas!`);
      render();
    }catch(err){
      console.error(err);
      alert("Erro ao importar. Use um Excel exportado pelo FinançasPro.");
    }
    input.value="";
  };
  r.readAsArrayBuffer(f);
}

/* ---- INIT ---- */
loadDB();
render();
</script>
